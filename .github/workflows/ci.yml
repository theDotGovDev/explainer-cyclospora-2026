name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/ci/build.sh

  links:
    name: Check source links resolve
    runs-on: ubuntu-latest
    # Advisory: a dead link is worth knowing about but should not block a
    # health-information fix from shipping. Agency sites also rate-limit CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/ci/links.sh
